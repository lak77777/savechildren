<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Samsung Notes</title>
    
    <link rel="apple-touch-icon" href="note.html.jpg">
    <link rel="icon" type="image/png" href="note.html.jpg">
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 50px 20px 10px; font-size: 26px; font-weight: bold; color: #1a1a1a; letter-spacing: -0.5px; }
        .ads { height: 55px; background: #f2f2f2; text-align: center; line-height: 55px; font-size: 11px; color: #999; border-bottom: 1px dotted #ddd; cursor: pointer; }
        textarea { flex: 1; border: none; padding: 20px; font-size: 18px; outline: none; resize: none; line-height: 1.6; color: #333; }
        footer { padding: 10px 25px 35px; border-top: 1px solid #f0f0f0; background: #fff; display: flex; justify-content: space-between; align-items: center; }
        .menu-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #777; font-size: 10px; font-weight: 500; }
        .youtube-btn { margin-bottom: 5px; opacity: 0.8; }
        .youtube-icon { width: 32px; height: 24px; background: #FF0000; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; }
        .youtube-icon::after { content: ''; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid white; margin-left: 2px; }
        #install-guide { font-size: 11px; color: #fff; text-align: center; background: #ff4757; padding: 10px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="install-guide" onclick="this.style.display='none'">
    💡 크롬 마크를 없애려면 '앱 설치' 또는 '홈 화면에 추가'를 누르세요! (클릭시 닫힘)
</div>

<header>모든 노트</header>

<div class="ads" onclick="window.open('https://your-ad-link.com', '_blank')">
    추천 학습 콘텐츠 광고 (수익 최적화 영역)
</div>

<textarea id="memo" placeholder="여기에 메모를 작성하세요..."></textarea>

<footer>
    <div class="menu-item">
        <span style="font-size: 22px;">🗒️</span>
        <span>노트</span>
    </div>
    <a href="https://www.youtube.com" target="_blank" class="menu-item youtube-btn">
        <div class="youtube-icon"></div>
        <span>참고 영상</span>
    </a>
    <div class="menu-item">
        <span style="font-size: 22px;">⚙️</span>
        <span>설정</span>
    </div>
</footer>

<script>
    const area = document.getElementById('memo');
    area.value = localStorage.getItem('mySecretMemo') || "";
    area.addEventListener('input', () => {
        localStorage.setItem('mySecretMemo', area.value);
    });

    // PWA 설치 여부 확인 및 가이드 표시
    if (!window.matchMedia('(display-mode: standalone)').matches) {
        document.getElementById('install-guide').style.display = 'block';
    }
</script>
</body>
</html>
